[package]
name = "session"
version = "0.1.0"
edition = "2024"

[lib]
name = "session"
path = "src/lib.rs"


[dependencies]
# psqnet_transport = { path = "../transport" }
arrayvec = { features = ["std", "serde"], version = "*"}
smallvec = { features = ["union", "serde"], version = "*"}
rand_core = "*"
rand = "*"
bytemuck = "*"
dashmap = { features = ["raw-api"], version = "*"}
zeroize = "*"
hex-literal = "*"
cbor4ii = { features = ["use_std", "serde1"], version = "*" }
serde = { features = ["derive"], version = "*" }
serde_bytes = "*"
bytes = "*"
tokio = { features = ["sync"], version = "*" }
# rustqlite = "*"

[lints.clippy]
type_complexity = "allow"
large_enum_variant = "allow"
absurd_extreme_comparisons = "allow"
unusual_byte_groupings = "allow"
needless_range_loop = "allow"
